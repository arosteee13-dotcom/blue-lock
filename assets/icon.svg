<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020813"/>
      <stop offset="50%" stop-color="#07182e"/>
      <stop offset="100%" stop-color="#002d62"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <!-- Pentagon Ego Lock Frame -->
  <polygon points="256,40 450,180 370,430 142,430 62,180" fill="none" stroke="#00f3ff" stroke-width="12" filter="url(#glow)"/>
  <!-- Chain Links -->
  <path d="M 120 120 L 200 200 M 392 120 L 312 200" stroke="#00f3ff" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <!-- Glowing Eye / Ego Aura -->
  <path d="M 160 256 Q 256 160 352 256 Q 256 352 160 256 Z" fill="none" stroke="url(#cyanGlow)" stroke-width="14" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="45" fill="#00f3ff" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="20" fill="#ffffff"/>
  <!-- Geometric Shards -->
  <polygon points="256,100 280,140 232,140" fill="#00f3ff" opacity="0.8"/>
  <polygon points="256,410 280,370 232,370" fill="#00f3ff" opacity="0.8"/>
</svg>